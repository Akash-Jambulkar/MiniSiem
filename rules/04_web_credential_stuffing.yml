id: web_credential_stuffing
name: Web Credential Stuffing
description: 20+ failed POST /login requests from one IP in 60 seconds (HTTP 401/403).
severity: high
mitre: T1110.004
mitre_tactic: TA0006
references:
  - https://attack.mitre.org/techniques/T1110/004/
logic:
  type: threshold
  match:
    event_type: web_login_failed
  group_by: source_ip
  window_seconds: 60
  threshold: 20
