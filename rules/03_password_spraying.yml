id: password_spraying
name: Password Spraying
description: Single source IP fails auth for 10+ distinct usernames within 10 minutes.
severity: high
mitre: T1110.003
mitre_tactic: TA0006
references:
  - https://attack.mitre.org/techniques/T1110/003/
logic:
  type: distinct_users
  match:
    event_type: ssh_failed_login
  group_by: source_ip
  distinct_field: user
  window_seconds: 600
  threshold: 10
