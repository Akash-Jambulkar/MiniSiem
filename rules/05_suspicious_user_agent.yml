id: suspicious_user_agent
name: Suspicious Scanner User-Agent
description: Access log request from a known offensive tool (sqlmap, nikto, nmap, hydra).
severity: medium
mitre: T1595
mitre_tactic: TA0043  # Reconnaissance
references:
  - https://attack.mitre.org/techniques/T1595/
logic:
  type: field_match
  match:
    user_agent:
      regex: "(sqlmap|nikto|nmap|hydra|masscan|dirbuster|gobuster|wpscan)"
